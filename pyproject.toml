[project]
name = "interview-sparring-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Oleg Anastassov", email = "oleg.anastassov@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.15",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
interview-sparring-agent = "interview_sparring_agent.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]
eval = [
    "langsmith>=0.11.0",
]
